openapi: 3.1.0
info:
  title: YRAK Control Center Supplemental API
  version: 0.2.0
  description: >-
    Contrato suplementario para vistas read-only, health, revisión de intake,
    RAG autorizado e IA sintética del YRAK Control Center. No sustituye
    openapi/yrak-api.yaml ni otorga autoridad laboral al frontend o a la IA.
security:
  - cloudflareAccessJwt: []
paths:
  /v1/reference/groups:
    get:
      operationId: listReferenceGroups
      summary: Lista grupos visibles para el usuario autenticado
      responses:
        '200':
          description: Grupos activos dentro del scope del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemsResponse'
  /v1/reference/groups/{groupId}/levels:
    get:
      operationId: listReferenceLevels
      summary: Lista niveles activos de un grupo autorizado
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': { description: Niveles visibles }
        '403': { description: Grupo fuera del scope del usuario }
        '404': { description: Grupo inexistente }
  /v1/reference/requirements:
    get:
      operationId: listReferenceRequirements
      summary: Lista catálogo activo de requisitos de la organización
      responses:
        '200': { description: Requisitos activos }
  /v1/reference/groups/{groupId}/rotation-pools:
    get:
      operationId: listReferenceRotationPools
      summary: Lista pools activos del grupo autorizado
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '200': { description: Pools activos }
        '403': { description: Grupo fuera del scope del usuario }
  /v1/reference/rotation-pools/{poolId}/queue:
    get:
      operationId: getReferenceRotationQueue
      summary: Cola de rotación read-only para un pool autorizado
      parameters:
        - in: path
          name: poolId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Cola de rotación }
        '403': { description: Pool/grupo fuera del scope del usuario }
        '404': { description: Pool inexistente }
  /v1/intake/drafts/{draftId}:
    get:
      operationId: getIntakeDraftForReview
      summary: Carga un borrador para revisión humana
      description: >-
        ADMIN/HR pueden consultar borradores de su organización. SUPERVISOR y
        OPERATOR sólo pueden consultar borradores creados por ellos mismos.
      parameters:
        - in: path
          name: draftId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Metadata y extracción estructurada del borrador }
        '403': { description: Borrador creado por otro usuario o fuera del scope }
        '404': { description: Borrador inexistente }
        '500': { description: JSON persistido inválido; no se consume el borrador }
  /v1/rag/search:
    post:
      operationId: searchAuthorizedRag
      summary: Recupera chunks RAG dentro del scope autorizado del usuario
      description: >-
        Sólo retrieval/citas. El backend deriva organization/group scope de la
        identidad autenticada, lo pasa al adapter y vuelve a validar cada chunk
        antes de responder. La auditoría persiste hash SHA-256 de la consulta,
        no el texto de la consulta. No toma decisiones laborales.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [query]
              properties:
                query: { type: string, minLength: 2, maxLength: 2000 }
                topK: { type: integer, minimum: 1, maximum: 20, default: 8 }
      responses:
        '200':
          description: Chunks y citas autorizados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RagSearchResponse'
        '403': { description: Rol no autorizado }
        '502': { description: Adapter devolvió un resultado fuera del scope y la respuesta fue bloqueada }
        '503': { description: RAG no configurado o upstream no disponible }
  /v1/system/health:
    get:
      operationId: getControlCenterSystemHealth
      summary: Estado básico del runtime sin secretos
      responses:
        '200':
          description: Estado de D1, bindings principales y proveedor/modelo de IA activos
          content:
            application/json:
              schema:
                type: object
                required: [service, environment, database, r2, workersAi, queue, workflow, email, aiProvider, aiModel]
                properties:
                  service: { type: string }
                  environment: { type: string, enum: [development, staging, production] }
                  database: { type: string, enum: [healthy, down] }
                  r2: { $ref: '#/components/schemas/BindingStatus' }
                  workersAi: { $ref: '#/components/schemas/BindingStatus' }
                  queue: { $ref: '#/components/schemas/BindingStatus' }
                  workflow: { $ref: '#/components/schemas/BindingStatus' }
                  email: { $ref: '#/components/schemas/BindingStatus' }
                  aiProvider: { type: string, description: ID público/no secreto del proveedor activo }
                  aiModel: { type: [string, 'null'], description: ID del modelo activo; nunca contiene credenciales }
  /v1/system/integrations:
    get:
      operationId: getControlCenterIntegrations
      summary: Indica implementación/configuración detectada sin devolver valores secretos
      responses:
        '200':
          description: Metadatos no secretos de integraciones
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, configured, detail]
                      properties:
                        id:
                          type: string
                          enum: [cloudflare, supabase, upstash, modal, nvidia, huggingface, ollama, gmail]
                        implemented: { type: boolean }
                        configured: { type: boolean }
                        declared: { type: boolean }
                        detail: { type: string }
  /v1/system/ai-smoke-test:
    post:
      operationId: runSyntheticAiSmokeTest
      summary: Ejecuta prueba sintética sin datos laborales ni side effects
      description: >-
        Disponible sólo para ADMIN/HR en development o staging. Producción
        devuelve 403. El prompt es fijo en backend y no acepta contenido del usuario.
      responses:
        '200':
          description: Resultado técnico del proveedor configurado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSmokeResult'
        '403': { description: Rol no autorizado o producción }
        '503':
          description: Proveedor no configurado, no disponible o fallo de inferencia; no devuelve detalle secreto
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/AiSmokeResult'
                  - type: object
                    required: [error]
                    properties:
                      error: { type: string, const: AI_SMOKE_TEST_FAILED }
components:
  securitySchemes:
    cloudflareAccessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: >-
        JWT emitido por Cloudflare Access. El API valida firma RS256/JWKS,
        issuer, audience, expiración, nbf y email. El header de email de Access
        no es una credencial aceptada por el backend.
  parameters:
    GroupId:
      in: path
      name: groupId
      required: true
      schema: { type: string }
  schemas:
    BindingStatus:
      type: string
      enum: [configured, not_configured]
    AiSmokeResult:
      type: object
      required: [ok, provider, model, latencyMs, responseChars]
      properties:
        ok: { type: boolean }
        provider: { type: string }
        model: { type: [string, 'null'] }
        latencyMs: { type: integer, minimum: 0 }
        responseChars: { type: integer, minimum: 0 }
    RagCitation:
      type: object
      required: [documentId, chunkId]
      properties:
        documentId: { type: string }
        chunkId: { type: string }
        page: { type: [integer, 'null'], minimum: 1 }
        section: { type: [string, 'null'] }
        documentVersion: { type: [string, 'null'] }
        source: { type: [string, 'null'] }
    RagChunk:
      type: object
      required: [chunkId, documentId, organizationId, text, score, status]
      properties:
        chunkId: { type: string }
        documentId: { type: string }
        organizationId: { type: string }
        groupId: { type: [string, 'null'] }
        text: { type: string }
        score: { type: number }
        status: { type: string }
        page: { type: [integer, 'null'] }
        section: { type: [string, 'null'] }
        documentVersion: { type: [string, 'null'] }
        source: { type: [string, 'null'] }
    RagSearchResponse:
      type: object
      required: [items, citations]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RagChunk' }
        citations:
          type: array
          items: { $ref: '#/components/schemas/RagCitation' }
    ItemsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
